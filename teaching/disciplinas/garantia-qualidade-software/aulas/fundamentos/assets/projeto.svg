<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440">
  <defs>
    <marker id="proj-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-seta-cabeca"/>
    </marker>
  </defs>
  <text x="160" y="40" text-anchor="middle" font-size="22" class="dg-titulo">entradas de projeto</text>
  <text x="500" y="40" text-anchor="middle" font-size="22" class="dg-titulo">atividades de projeto</text>
  <text x="840" y="40" text-anchor="middle" font-size="22" class="dg-titulo">saídas de projeto</text>

  <rect x="10" y="70" width="300" height="330" rx="12" class="dg-forma" stroke-dasharray="8 6"/>
  <text x="160" y="150" text-anchor="middle" font-size="18" class="dg-rotulo">informação da plataforma</text>
  <text x="160" y="235" text-anchor="middle" font-size="18" class="dg-rotulo">especificação de requisitos</text>
  <text x="160" y="320" text-anchor="middle" font-size="18" class="dg-rotulo">descrição dos dados</text>

  <rect x="350" y="70" width="300" height="330" rx="12" class="dg-forma"/>
  <text x="500" y="125" text-anchor="middle" font-size="18" class="dg-rotulo">projeto de arquitetura</text>
  <text x="500" y="200" text-anchor="middle" font-size="18" class="dg-rotulo">projeto de interface</text>
  <text x="500" y="275" text-anchor="middle" font-size="18" class="dg-rotulo">projeto de componentes</text>
  <text x="500" y="350" text-anchor="middle" font-size="18" class="dg-rotulo">projeto de banco de dados</text>

  <rect x="690" y="70" width="300" height="330" rx="12" class="dg-forma" stroke-dasharray="8 6"/>
  <text x="840" y="125" text-anchor="middle" font-size="18" class="dg-rotulo">arquitetura do sistema</text>
  <text x="840" y="200" text-anchor="middle" font-size="18" class="dg-rotulo">especificação de banco</text>
  <text x="840" y="275" text-anchor="middle" font-size="18" class="dg-rotulo">especificação de interface</text>
  <text x="840" y="350" text-anchor="middle" font-size="18" class="dg-rotulo">especificação de componentes</text>

  <path d="M310,235 L350,235" class="dg-seta" marker-end="url(#proj-seta)"/>
  <path d="M650,235 L690,235" class="dg-seta" marker-end="url(#proj-seta)"/>

</svg>
