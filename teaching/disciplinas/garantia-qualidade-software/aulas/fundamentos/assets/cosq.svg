<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460">
  <defs>
    <marker id="cosq-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-seta-cabeca"/>
    </marker>
  </defs>
  <rect x="330" y="20" width="340" height="60" rx="10" class="dg-forma"/>
  <text x="500" y="58" text-anchor="middle" font-size="22" class="dg-titulo">custo da qualidade (CoSQ)</text>

  <path d="M500,80 L500,110 L250,110 L250,140" class="dg-seta" marker-end="url(#cosq-seta)"/>
  <path d="M500,80 L500,110 L750,110 L750,140" class="dg-seta" marker-end="url(#cosq-seta)"/>

  <rect x="90" y="140" width="320" height="60" rx="10" class="dg-forma"/>
  <text x="250" y="178" text-anchor="middle" font-size="21" class="dg-rotulo">conformidade</text>
  <rect x="590" y="140" width="320" height="60" rx="10" class="dg-forma"/>
  <text x="750" y="178" text-anchor="middle" font-size="21" class="dg-rotulo">não-conformidade</text>

  <path d="M250,200 L250,230 L150,230 L150,260" class="dg-seta" marker-end="url(#cosq-seta)"/>
  <path d="M250,200 L250,230 L350,230 L350,260" class="dg-seta" marker-end="url(#cosq-seta)"/>
  <path d="M750,200 L750,230 L650,230 L650,260" class="dg-seta" marker-end="url(#cosq-seta)"/>
  <path d="M750,200 L750,230 L850,230 L850,260" class="dg-seta" marker-end="url(#cosq-seta)"/>

  <rect x="60" y="260" width="180" height="100" rx="10" class="dg-forma"/>
  <text x="150" y="298" text-anchor="middle" font-size="20" class="dg-rotulo">prevenção</text>
  <text x="150" y="330" text-anchor="middle" font-size="15" class="dg-menor">processo · ferramentas</text>
  <text x="150" y="350" text-anchor="middle" font-size="15" class="dg-menor">treinamento</text>

  <rect x="260" y="260" width="180" height="100" rx="10" class="dg-forma"/>
  <text x="350" y="298" text-anchor="middle" font-size="20" class="dg-rotulo">avaliação</text>
  <text x="350" y="330" text-anchor="middle" font-size="15" class="dg-menor">revisão · auditoria</text>
  <text x="350" y="350" text-anchor="middle" font-size="15" class="dg-menor">teste</text>

  <rect x="560" y="260" width="180" height="100" rx="10" class="dg-forma"/>
  <text x="650" y="298" text-anchor="middle" font-size="20" class="dg-rotulo">falha interna</text>
  <text x="650" y="330" text-anchor="middle" font-size="15" class="dg-menor">retrabalho</text>
  <text x="650" y="350" text-anchor="middle" font-size="15" class="dg-menor">antes da entrega</text>

  <rect x="760" y="260" width="180" height="100" rx="10" class="dg-forma"/>
  <text x="850" y="298" text-anchor="middle" font-size="20" class="dg-rotulo">falha externa</text>
  <text x="850" y="330" text-anchor="middle" font-size="15" class="dg-menor">depois da entrega</text>
  <text x="850" y="350" text-anchor="middle" font-size="15" class="dg-menor">+ o custo do cliente</text>

  <text x="250" y="410" text-anchor="middle" font-size="16" class="dg-menor">o que se paga para evitar e achar</text>
  <text x="750" y="410" text-anchor="middle" font-size="16" class="dg-menor">o que se paga por não ter evitado nem achado</text>
</svg>
