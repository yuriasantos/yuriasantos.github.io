<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
  <defs>
    <marker id="req-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-seta-cabeca"/>
    </marker>
  </defs>
  <!-- viabilidade (tracejada: 9ª ed. / Gallotti) -->
  <rect x="20" y="150" width="170" height="90" rx="10" class="dg-forma" stroke-dasharray="8 6"/>
  <text x="105" y="188" text-anchor="middle" font-size="19" class="dg-rotulo">estudo de</text>
  <text x="105" y="214" text-anchor="middle" font-size="19" class="dg-rotulo">viabilidade</text>
  <text x="105" y="270" text-anchor="middle" font-size="14" class="dg-menor">vale a pena? dá com o que se tem?</text>

  <rect x="250" y="150" width="200" height="90" rx="10" class="dg-forma"/>
  <text x="350" y="188" text-anchor="middle" font-size="19" class="dg-rotulo">elicitação</text>
  <text x="350" y="214" text-anchor="middle" font-size="19" class="dg-rotulo">e análise</text>
  <text x="350" y="270" text-anchor="middle" font-size="14" class="dg-menor">com os stakeholders</text>

  <rect x="510" y="150" width="200" height="90" rx="10" class="dg-forma"/>
  <text x="610" y="202" text-anchor="middle" font-size="19" class="dg-rotulo">especificação</text>
  <text x="610" y="270" text-anchor="middle" font-size="14" class="dg-menor">o documento; pode ser contrato</text>

  <rect x="770" y="150" width="200" height="90" rx="10" class="dg-forma"/>
  <text x="870" y="202" text-anchor="middle" font-size="19" class="dg-rotulo">validação</text>
  <text x="870" y="270" text-anchor="middle" font-size="14" class="dg-menor">é o que o cliente quer?</text>

  <path d="M190,195 L250,195" class="dg-seta" marker-end="url(#req-seta)"/>
  <path d="M450,195 L510,195" class="dg-seta" marker-end="url(#req-seta)"/>
  <path d="M710,195 L770,195" class="dg-seta" marker-end="url(#req-seta)"/>

  <!-- retorno: iterativo, em espiral -->
  <path d="M870,150 L870,80 L350,80 L350,150" class="dg-seta" marker-end="url(#req-seta)"/>
  <text x="610" y="66" text-anchor="middle" font-size="16" class="dg-menor">iterativo — "a espiral" · gestão de requisitos</text>

</svg>
