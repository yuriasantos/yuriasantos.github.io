<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440">
  <defs>
    <marker id="bpmc-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-seta-cabeca"/>
    </marker>
  </defs>

  <!-- seis fases em ciclo, como a Figura 1 do cap. 2 (p. 35 do PDF) -->
  <!-- linha de cima: Planejar → Modelar → Implementar -->
  <rect x="150" y="60" width="190" height="70" rx="10" class="dg-forma"/>
  <text x="245" y="90" text-anchor="middle" font-size="19" class="dg-rotulo">Planejar</text>
  <text x="245" y="113" text-anchor="middle" font-size="11" class="dg-menor">quais processos sustentam o negócio</text>

  <rect x="405" y="60" width="190" height="70" rx="10" class="dg-linha" stroke-width="3"/>
  <text x="500" y="90" text-anchor="middle" font-size="19" class="dg-rotulo">Modelar</text>
  <text x="500" y="113" text-anchor="middle" font-size="13" class="dg-menor">As-Is → To-Be</text>

  <rect x="660" y="60" width="190" height="70" rx="10" class="dg-forma"/>
  <text x="755" y="90" text-anchor="middle" font-size="19" class="dg-rotulo">Implementar</text>
  <text x="755" y="113" text-anchor="middle" font-size="11" class="dg-menor">regras, padrões, automação</text>

  <!-- linha de baixo: Otimizar ← Monitorar ← Executar -->
  <rect x="150" y="260" width="190" height="70" rx="10" class="dg-forma"/>
  <text x="245" y="290" text-anchor="middle" font-size="19" class="dg-rotulo">Otimizar</text>
  <text x="245" y="313" text-anchor="middle" font-size="11" class="dg-menor">refinar; reduzir o tempo de ciclo</text>

  <rect x="405" y="260" width="190" height="70" rx="10" class="dg-forma"/>
  <text x="500" y="290" text-anchor="middle" font-size="19" class="dg-rotulo">Monitorar</text>
  <text x="500" y="313" text-anchor="middle" font-size="11" class="dg-menor">indicadores para quem decide</text>

  <rect x="660" y="260" width="190" height="70" rx="10" class="dg-forma"/>
  <text x="755" y="290" text-anchor="middle" font-size="19" class="dg-rotulo">Executar</text>
  <text x="755" y="313" text-anchor="middle" font-size="13" class="dg-menor">o processo gera valor?</text>

  <!-- setas do ciclo (horário) -->
  <path d="M340,95 L405,95" class="dg-seta" marker-end="url(#bpmc-seta)"/>
  <path d="M595,95 L660,95" class="dg-seta" marker-end="url(#bpmc-seta)"/>
  <path d="M755,130 L755,260" class="dg-seta" marker-end="url(#bpmc-seta)"/>
  <path d="M660,295 L595,295" class="dg-seta" marker-end="url(#bpmc-seta)"/>
  <path d="M405,295 L340,295" class="dg-seta" marker-end="url(#bpmc-seta)"/>
  <path d="M245,260 L245,130" class="dg-seta" marker-end="url(#bpmc-seta)"/>

  <!-- marcador: hoje -->
  <circle cx="500" cy="180" r="6" class="dg-ponto-2"/>
  <text x="500" y="205" text-anchor="middle" font-size="15" class="dg-rotulo">hoje: Modelar, As-Is</text>
  <text x="500" y="226" text-anchor="middle" font-size="13" class="dg-menor">"o primeiro passo em qualquer projeto BPM […] é entender o processo existente" (pp. 39–40)</text>

  <text x="500" y="405" text-anchor="middle" font-size="14" class="dg-menor">Figura 1 do cap. 2, "Adaptado de Baldam et al. (2007) e Houy et al. (2010)" — p. 35 do PDF, redesenhada</text>
</svg>
