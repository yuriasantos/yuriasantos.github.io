<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <defs>
    <marker id="tqm-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-seta-cabeca"/>
    </marker>
    <marker id="tqm-seta-ciclo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-seta-cabeca"/>
    </marker>
  </defs>

  <!-- ===== esquerda: o ciclo PDCA — "a fase da melhoria contínua" (p. 22) ===== -->
  <text x="200" y="40" text-anchor="middle" font-size="18" class="dg-titulo">melhoria contínua</text>
  <text x="200" y="64" text-anchor="middle" font-size="14" class="dg-menor">o ciclo PDCA</text>

  <!-- quatro arcos, sentido horário, centro (200,240) r=120 -->
  <path d="M200,120 A120,120 0 0 1 320,240" class="dg-linha" stroke-width="5" marker-end="url(#tqm-seta-ciclo)"/>
  <path d="M320,240 A120,120 0 0 1 200,360" class="dg-linha" stroke-width="5" marker-end="url(#tqm-seta-ciclo)"/>
  <path d="M200,360 A120,120 0 0 1 80,240" class="dg-linha" stroke-width="5" marker-end="url(#tqm-seta-ciclo)"/>
  <path d="M80,240  A120,120 0 0 1 200,120" class="dg-linha" stroke-width="5" marker-end="url(#tqm-seta-ciclo)"/>

  <!-- rótulos dos quadrantes -->
  <text x="255" y="192" text-anchor="middle" font-size="24" class="dg-rotulo" font-weight="700">P</text>
  <text x="255" y="212" text-anchor="middle" font-size="13" class="dg-menor">planejar</text>
  <text x="255" y="300" text-anchor="middle" font-size="24" class="dg-rotulo" font-weight="700">D</text>
  <text x="255" y="320" text-anchor="middle" font-size="13" class="dg-menor">executar</text>
  <text x="145" y="300" text-anchor="middle" font-size="24" class="dg-rotulo" font-weight="700">C</text>
  <text x="145" y="320" text-anchor="middle" font-size="13" class="dg-menor">verificar</text>
  <text x="145" y="192" text-anchor="middle" font-size="24" class="dg-rotulo" font-weight="700">A</text>
  <text x="145" y="212" text-anchor="middle" font-size="13" class="dg-menor">atuar</text>

  <text x="200" y="392" text-anchor="middle" font-size="14" class="dg-menor">"controle e melhoria contínua de processos e produtos" (p. 22)</text>

  <!-- ===== direita: a qualidade total como sistema (p. 25) ===== -->
  <line x1="410" y1="60" x2="410" y2="420" class="dg-traco"/>

  <rect x="450" y="90" width="500" height="64" rx="10" class="dg-linha" stroke-width="3"/>
  <text x="700" y="118" text-anchor="middle" font-size="19" class="dg-rotulo">gestão da qualidade total</text>
  <text x="700" y="141" text-anchor="middle" font-size="14" class="dg-menor">"o objetivo […] é a melhoria contínua" (p. 25)</text>

  <!-- três princípios, como pilares -->
  <rect x="450" y="210" width="150" height="90" rx="10" class="dg-forma"/>
  <text x="525" y="248" text-anchor="middle" font-size="17" class="dg-rotulo">ênfase</text>
  <text x="525" y="272" text-anchor="middle" font-size="17" class="dg-rotulo">no cliente</text>

  <rect x="625" y="210" width="150" height="90" rx="10" class="dg-forma"/>
  <text x="700" y="248" text-anchor="middle" font-size="17" class="dg-rotulo">melhoria</text>
  <text x="700" y="272" text-anchor="middle" font-size="17" class="dg-rotulo">dos processos</text>

  <rect x="800" y="210" width="150" height="90" rx="10" class="dg-forma"/>
  <text x="875" y="248" text-anchor="middle" font-size="17" class="dg-rotulo">envolvimento</text>
  <text x="875" y="272" text-anchor="middle" font-size="17" class="dg-rotulo">total</text>

  <path d="M525,210 L525,154" class="dg-seta" marker-end="url(#tqm-seta)"/>
  <path d="M700,210 L700,154" class="dg-seta" marker-end="url(#tqm-seta)"/>
  <path d="M875,210 L875,154" class="dg-seta" marker-end="url(#tqm-seta)"/>

  <!-- a base: de que o sistema é feito -->
  <rect x="450" y="340" width="500" height="50" rx="8" class="dg-eixo" stroke-dasharray="6 5"/>
  <text x="700" y="361" text-anchor="middle" font-size="14" class="dg-menor">princípios · valores · ferramentas · técnicas · comportamento de pessoas</text>
  <text x="700" y="381" text-anchor="middle" font-size="14" class="dg-menor">"e necessita integrar à cultura organizacional"</text>

  <path d="M700,340 L700,300" class="dg-seta" marker-end="url(#tqm-seta)"/>

  <!-- ligação PDCA → princípio do meio -->
  <path d="M322,240 L390,240 L390,255 L450,255" class="dg-seta" marker-end="url(#tqm-seta)"/>

  <text x="500" y="445" text-anchor="middle" font-size="14" class="dg-menor">"pequena" qualidade = o produto · "grande" qualidade = a organização inteira (Ishikawa, 1990)</text>
</svg>
