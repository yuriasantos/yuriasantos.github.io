<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440">
  <defs>
    <marker id="casc-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-seta-cabeca"/>
    </marker>
  </defs>

  <!-- cinco etapas em escada (Fig. 3.1) -->
  <rect x="20" y="20" width="185" height="64" rx="8" class="dg-forma"/>
  <text x="112" y="47" text-anchor="middle" font-size="16" class="dg-rotulo">Definição de</text>
  <text x="112" y="68" text-anchor="middle" font-size="16" class="dg-rotulo">Requisitos</text>

  <rect x="215" y="92" width="185" height="64" rx="8" class="dg-forma"/>
  <text x="307" y="119" text-anchor="middle" font-size="16" class="dg-rotulo">Projeto do Sistema</text>
  <text x="307" y="140" text-anchor="middle" font-size="16" class="dg-rotulo">e do Software</text>

  <rect x="410" y="164" width="185" height="64" rx="8" class="dg-forma"/>
  <text x="502" y="191" text-anchor="middle" font-size="16" class="dg-rotulo">Implementação e</text>
  <text x="502" y="212" text-anchor="middle" font-size="16" class="dg-rotulo">Testes Unitários</text>

  <rect x="605" y="236" width="185" height="64" rx="8" class="dg-forma"/>
  <text x="697" y="263" text-anchor="middle" font-size="16" class="dg-rotulo">Integração e</text>
  <text x="697" y="284" text-anchor="middle" font-size="16" class="dg-rotulo">Teste do Sistema</text>

  <rect x="800" y="308" width="185" height="64" rx="8" class="dg-forma"/>
  <text x="892" y="335" text-anchor="middle" font-size="16" class="dg-rotulo">Operação e</text>
  <text x="892" y="356" text-anchor="middle" font-size="16" class="dg-rotulo">Manutenção</text>

  <!-- setas: sai pela direita, desce até o topo da próxima -->
  <path d="M205,52 L307,52 L307,92" class="dg-seta" marker-end="url(#casc-seta)"/>
  <path d="M400,124 L502,124 L502,164" class="dg-seta" marker-end="url(#casc-seta)"/>
  <path d="M595,196 L697,196 L697,236" class="dg-seta" marker-end="url(#casc-seta)"/>
  <path d="M790,268 L892,268 L892,308" class="dg-seta" marker-end="url(#casc-seta)"/>

  <!-- o que a cascata não contempla (p. 29) -->
  <text x="40" y="300" font-size="15" class="dg-menor">antes do ciclo: estudo de viabilidade</text>
  <text x="40" y="326" font-size="15" class="dg-menor">durante todo o ciclo: planejamento e gerenciamento,</text>
  <text x="40" y="350" font-size="15" class="dg-menor">verificação e validação, configuração, documentação</text>
  <text x="500" y="418" text-anchor="middle" font-size="14" class="dg-menor">"mais apropriado quando os requisitos são bem entendidos" (p. 31)</text>
</svg>
