<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <defs>
    <marker id="bpmn-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-seta-cabeca"/>
    </marker>
  </defs>

  <!-- pool: um participante -->
  <rect x="20" y="30" width="960" height="300" class="dg-forma"/>
  <line x1="60" y1="30" x2="60" y2="330" class="dg-eixo"/>
  <text x="40" y="180" text-anchor="middle" font-size="17" class="dg-rotulo" transform="rotate(-90 40 180)">Empresa</text>

  <!-- raias: quem faz -->
  <line x1="60" y1="180" x2="980" y2="180" class="dg-eixo"/>
  <text x="85" y="105" text-anchor="middle" font-size="14" class="dg-menor" transform="rotate(-90 85 105)">Atendimento</text>
  <text x="85" y="255" text-anchor="middle" font-size="14" class="dg-menor" transform="rotate(-90 85 255)">Instrutor</text>

  <!-- evento de início -->
  <circle cx="150" cy="105" r="18" class="dg-forma"/>
  <!-- tarefa -->
  <rect x="215" y="72" width="140" height="66" rx="10" class="dg-forma"/>
  <text x="285" y="111" text-anchor="middle" font-size="16" class="dg-rotulo">Confirmar</text>
  <!-- gateway exclusivo (X) -->
  <path d="M440,80 L465,105 L440,130 L415,105 z" class="dg-forma"/>
  <path d="M431,96 L449,114 M449,96 L431,114" class="dg-linha"/>
  <text x="440" y="66" text-anchor="middle" font-size="13" class="dg-menor">modalidade?</text>
  <!-- tarefa na raia de baixo -->
  <rect x="510" y="222" width="140" height="66" rx="10" class="dg-forma"/>
  <text x="580" y="261" text-anchor="middle" font-size="16" class="dg-rotulo">Ministrar aula</text>
  <!-- gateway exclusivo (X) de junção: caminhos alternativos se juntam com X, não com + (OMG 2010, p. 37) -->
  <path d="M735,80 L760,105 L735,130 L710,105 z" class="dg-forma"/>
  <path d="M726,96 L744,114 M744,96 L726,114" class="dg-linha"/>
  <!-- tarefa -->
  <rect x="800" y="72" width="120" height="66" rx="10" class="dg-forma"/>
  <text x="860" y="111" text-anchor="middle" font-size="16" class="dg-rotulo">Certificar</text>
  <!-- evento de fim -->
  <circle cx="955" cy="105" r="18" class="dg-forma" stroke-width="5"/>

  <!-- fluxos de seqüência -->
  <path d="M168,105 L215,105" class="dg-seta" marker-end="url(#bpmn-seta)"/>
  <path d="M355,105 L415,105" class="dg-seta" marker-end="url(#bpmn-seta)"/>
  <path d="M440,130 L440,255 L510,255" class="dg-seta" marker-end="url(#bpmn-seta)"/>
  <text x="452" y="160" font-size="13" class="dg-menor">ao vivo</text>
  <path d="M465,105 L710,105" class="dg-seta" marker-end="url(#bpmn-seta)"/>
  <text x="560" y="97" text-anchor="middle" font-size="13" class="dg-menor">gravado</text>
  <path d="M650,255 L735,255 L735,130" class="dg-seta" marker-end="url(#bpmn-seta)"/>
  <path d="M760,105 L800,105" class="dg-seta" marker-end="url(#bpmn-seta)"/>
  <path d="M920,105 L937,105" class="dg-seta" marker-end="url(#bpmn-seta)"/>

  <!-- legenda -->
  <circle cx="60" cy="395" r="11" class="dg-forma"/>
  <text x="80" y="400" font-size="15" class="dg-rotulo">início</text>
  <rect x="160" y="382" width="40" height="26" rx="6" class="dg-forma"/>
  <text x="210" y="400" font-size="15" class="dg-rotulo">tarefa</text>
  <path d="M310,382 L323,395 L310,408 L297,395 z" class="dg-forma"/>
  <path d="M305,390 L315,400 M315,390 L305,400" class="dg-linha"/>
  <text x="335" y="400" font-size="15" class="dg-rotulo">gateway exclusivo</text>
  <path d="M495,382 L508,395 L495,408 L482,395 z" class="dg-forma"/>
  <path d="M495,388 L495,402 M488,395 L502,395" class="dg-linha"/>
  <text x="520" y="400" font-size="15" class="dg-rotulo">gateway paralelo</text>
  <circle cx="680" cy="395" r="11" class="dg-forma" stroke-width="4"/>
  <text x="700" y="400" font-size="15" class="dg-rotulo">fim</text>
  <path d="M760,395 L810,395" class="dg-seta" marker-end="url(#bpmn-seta)"/>
  <text x="820" y="400" font-size="15" class="dg-rotulo">fluxo de seqüência</text>
  <text x="500" y="445" text-anchor="middle" font-size="14" class="dg-menor">pool = participante (a empresa) · raia = papel (quem faz) · gateway só roteia — quem decide é a tarefa anterior</text>
</svg>
