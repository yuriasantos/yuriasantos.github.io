<!-- "AI" as an umbrella term: a fitted line and a neural network are both called AI.
     Cores vêm das classes dg-* (tema/base.css) → seguem o toggle claro/escuro.
     Tamanhos de fonte em unidades do viewBox, para escalar com o desenho. -->
<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg">

  <!-- ============ painel esquerdo: regressão ============ -->
  <text class="dg-titulo" x="215" y="30" font-size="21" text-anchor="middle">Regression</text>

  <!-- eixos -->
  <path class="dg-eixo" d="M 85 95 L 85 300 L 355 300" stroke-width="1.5"/>

  <!-- reta ajustada -->
  <line class="dg-linha" x1="98" y1="278" x2="345" y2="146" stroke-width="3"/>

  <!-- observações -->
  <g class="dg-ponto">
    <circle cx="108" cy="272" r="6"/>
    <circle cx="134" cy="243" r="6"/>
    <circle cx="158" cy="251" r="6"/>
    <circle cx="184" cy="216" r="6"/>
    <circle cx="209" cy="221" r="6"/>
    <circle cx="236" cy="190" r="6"/>
    <circle cx="262" cy="196" r="6"/>
    <circle cx="288" cy="161" r="6"/>
    <circle cx="313" cy="168" r="6"/>
    <circle cx="338" cy="140" r="6"/>
  </g>

  <text class="dg-menor" x="215" y="332" font-size="16" text-anchor="middle">one line through the data</text>

  <!-- ============ divisória ============ -->
  <line class="dg-traco" x1="410" y1="20" x2="410" y2="340" stroke-width="1"/>

  <!-- ============ painel direito: rede neural ============ -->
  <text class="dg-titulo" x="615" y="30" font-size="21" text-anchor="middle">Neural network</text>

  <!-- conexões: entrada → oculta. dg-eixo (--muted) e não dg-traco (--rule):
       com 20 arestas, a hairline some e a rede vira pontos soltos. -->
  <g class="dg-eixo" stroke-width="0.7">
    <line x1="500" y1="130" x2="615" y2="105"/>
    <line x1="500" y1="130" x2="615" y2="170"/>
    <line x1="500" y1="130" x2="615" y2="235"/>
    <line x1="500" y1="130" x2="615" y2="300"/>
    <line x1="500" y1="195" x2="615" y2="105"/>
    <line x1="500" y1="195" x2="615" y2="170"/>
    <line x1="500" y1="195" x2="615" y2="235"/>
    <line x1="500" y1="195" x2="615" y2="300"/>
    <line x1="500" y1="260" x2="615" y2="105"/>
    <line x1="500" y1="260" x2="615" y2="170"/>
    <line x1="500" y1="260" x2="615" y2="235"/>
    <line x1="500" y1="260" x2="615" y2="300"/>
    <!-- oculta → saída -->
    <line x1="615" y1="105" x2="730" y2="163"/>
    <line x1="615" y1="105" x2="730" y2="228"/>
    <line x1="615" y1="170" x2="730" y2="163"/>
    <line x1="615" y1="170" x2="730" y2="228"/>
    <line x1="615" y1="235" x2="730" y2="163"/>
    <line x1="615" y1="235" x2="730" y2="228"/>
    <line x1="615" y1="300" x2="730" y2="163"/>
    <line x1="615" y1="300" x2="730" y2="228"/>
  </g>

  <!-- nós -->
  <g class="dg-ponto">
    <circle cx="500" cy="130" r="9.5"/>
    <circle cx="500" cy="195" r="9.5"/>
    <circle cx="500" cy="260" r="9.5"/>
    <circle cx="615" cy="105" r="9.5"/>
    <circle cx="615" cy="170" r="9.5"/>
    <circle cx="615" cy="235" r="9.5"/>
    <circle cx="615" cy="300" r="9.5"/>
    <circle cx="730" cy="163" r="9.5"/>
    <circle cx="730" cy="228" r="9.5"/>
  </g>

  <text class="dg-menor" x="615" y="332" font-size="16" text-anchor="middle">millions of adjusted weights</text>
</svg>
