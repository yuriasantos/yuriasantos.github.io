<!-- Classical IT vs AI: who writes the rule.
     Cores vêm das classes dg-* (tema/base.css) → seguem o toggle claro/escuro.
     O id do marker é único no arquivo porque TODOS os slides do deck vivem no
     mesmo documento HTML — id repetido faria url(#…) resolver no primeiro. -->
<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="seta-itai" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="dg-seta-cabeca" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <!-- ============ painel esquerdo: TI clássica ============ -->
  <text class="dg-titulo" x="215" y="30" font-size="21" text-anchor="middle">Classical IT</text>

  <rect class="dg-forma" x="160" y="58" width="110" height="40" rx="6" stroke-width="1.8"/>
  <text class="dg-rotulo" x="215" y="83" font-size="17" text-anchor="middle">input</text>

  <path class="dg-seta" d="M 215 98 L 215 128" stroke-width="1.8" marker-end="url(#seta-itai)"/>

  <path class="dg-forma" d="M 215 132 L 283 170 L 215 208 L 147 170 Z" stroke-width="1.8"/>
  <text class="dg-rotulo" x="215" y="176" font-size="18" text-anchor="middle">X ?</text>

  <!-- ramos: canto arredondado (Q) — o ângulo reto seco fica duro na projeção -->
  <path class="dg-seta" d="M 147 170 L 113 170 Q 105 170 105 178 L 105 246" stroke-width="1.8" marker-end="url(#seta-itai)"/>
  <path class="dg-seta" d="M 283 170 L 317 170 Q 325 170 325 178 L 325 246" stroke-width="1.8" marker-end="url(#seta-itai)"/>
  <text class="dg-menor" x="126" y="162" font-size="14" text-anchor="middle">yes</text>
  <text class="dg-menor" x="304" y="162" font-size="14" text-anchor="middle">no</text>

  <rect class="dg-forma" x="55" y="250" width="100" height="40" rx="6" stroke-width="1.8"/>
  <text class="dg-rotulo" x="105" y="275" font-size="17" text-anchor="middle">do Y</text>
  <rect class="dg-forma" x="275" y="250" width="100" height="40" rx="6" stroke-width="1.8"/>
  <text class="dg-rotulo" x="325" y="275" font-size="17" text-anchor="middle">do Z</text>

  <text class="dg-menor" x="215" y="330" font-size="16" text-anchor="middle">a person wrote the rule</text>

  <!-- ============ divisória ============ -->
  <line class="dg-traco" x1="410" y1="20" x2="410" y2="350" stroke-width="1"/>

  <!-- ============ painel direito: IA ============ -->
  <text class="dg-titulo" x="615" y="30" font-size="21" text-anchor="middle">AI</text>

  <rect class="dg-forma" x="505" y="58" width="220" height="40" rx="6" stroke-width="1.8"/>
  <text class="dg-rotulo" x="615" y="83" font-size="17" text-anchor="middle">historical data</text>

  <path class="dg-seta" d="M 615 98 L 615 118" stroke-width="1.8" marker-end="url(#seta-itai)"/>

  <rect class="dg-forma" x="505" y="122" width="220" height="40" rx="6" stroke-width="1.8"/>
  <text class="dg-rotulo" x="615" y="147" font-size="17" text-anchor="middle">learning</text>

  <path class="dg-seta" d="M 615 162 L 615 182" stroke-width="1.8" marker-end="url(#seta-itai)"/>

  <rect class="dg-linha-2" x="505" y="186" width="220" height="40" rx="6" stroke-width="2.4"/>
  <text class="dg-rotulo" x="615" y="211" font-size="17" text-anchor="middle">a learned rule</text>

  <path class="dg-seta" d="M 615 226 L 615 246" stroke-width="1.8" marker-end="url(#seta-itai)"/>

  <rect class="dg-forma" x="505" y="250" width="220" height="40" rx="6" stroke-width="1.8"/>
  <text class="dg-rotulo" x="615" y="275" font-size="17" text-anchor="middle">decision</text>

  <text class="dg-menor" x="615" y="330" font-size="16" text-anchor="middle">nobody wrote the rule</text>
</svg>
