<!-- Sen, Workiewicz & Puranam (2026) as summarised by the editors (p. 10): humans overlook valid analogies (low recall) but rarely misapply them (high precision); LLMs rarely miss valid analogies (high recall) but often surface spurious, internally coherent matches (low precision). Qualitative sketch — the positions carry no measured values. dg-* classes only. -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="rp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-seta-cabeca" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <!-- axes -->
  <line class="dg-seta" x1="140" y1="360" x2="600" y2="360" stroke-width="2.5" marker-end="url(#rp-arrow)"/>
  <line class="dg-seta" x1="140" y1="360" x2="140" y2="40" stroke-width="2.5" marker-end="url(#rp-arrow)"/>
  <text class="dg-rotulo" x="370" y="392" font-size="15" text-anchor="middle">recall — how many of the valid analogies get found</text>
  <text class="dg-rotulo" x="92" y="200" font-size="15" text-anchor="middle" transform="rotate(-90 92 200)">precision — how many of the found ones actually fit</text>
  <text class="dg-menor" x="150" y="378" font-size="12">low</text>
  <text class="dg-menor" x="590" y="378" font-size="12" text-anchor="end">high</text>
  <text class="dg-menor" x="132" y="352" font-size="12" text-anchor="end">low</text>
  <text class="dg-menor" x="132" y="72" font-size="12" text-anchor="end">high</text>

  <!-- humans: low recall, high precision -->
  <circle class="dg-ponto" cx="240" cy="110" r="16"/>
  <text class="dg-rotulo" x="270" y="105" font-size="18">Humans</text>
  <text class="dg-menor" x="270" y="127" font-size="13">frequently overlook valid analogies,</text>
  <text class="dg-menor" x="270" y="145" font-size="13">rarely misapply them</text>

  <!-- LLMs: high recall, low precision -->
  <circle class="dg-ponto-2" cx="520" cy="300" r="16"/>
  <text class="dg-rotulo" x="492" y="295" font-size="18" text-anchor="end">Eight LLMs</text>
  <text class="dg-menor" x="492" y="317" font-size="13" text-anchor="end">rarely miss valid analogies, but often</text>
  <text class="dg-menor" x="492" y="335" font-size="13" text-anchor="end">surface spurious — internally coherent — matches</text>

  <!-- the trade-off line -->
  <line class="dg-eixo" x1="256" y1="126" x2="504" y2="284" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text class="dg-menor" x="400" y="195" font-size="13" text-anchor="middle" transform="rotate(32 400 195)">a clear trade-off</text>

  <!-- what it means for the ladder -->
  <rect class="dg-forma" x="660" y="60" width="270" height="160" rx="10" stroke-width="2.5"/>
  <text class="dg-rotulo" x="795" y="90" font-size="15" text-anchor="middle">Level 3, in practice</text>
  <text class="dg-menor" x="680" y="118" font-size="13">the machine widens the search</text>
  <text class="dg-menor" x="680" y="138" font-size="13">for analogies; the human still</text>
  <text class="dg-menor" x="680" y="158" font-size="13">judges "which external analogies</text>
  <text class="dg-menor" x="680" y="178" font-size="13">are strategically relevant" and</text>
  <text class="dg-menor" x="680" y="198" font-size="13">whether context blocks transport</text>
  <text class="dg-menor" x="795" y="250" font-size="12" text-anchor="middle">Table 2 human role at Level 3 · §2.1.3, p. 5</text>
  <text class="dg-menor" x="795" y="300" font-size="12" text-anchor="middle">positions are qualitative — no values reported</text>
  <text class="dg-menor" x="795" y="318" font-size="12" text-anchor="middle">in the editors' summary</text>
</svg>
