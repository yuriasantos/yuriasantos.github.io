<!-- Two ladders side by side: causal (what reasoning does the task demand?) and delegation (how much discretion will we grant?). After Csaszar et al. (2026), Tables 1–3. No colours: dg-* classes only. -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-titulo" x="230" y="34" font-size="19" text-anchor="middle">Causal ladder</text>
  <text class="dg-menor" x="230" y="56" font-size="14" text-anchor="middle">what reasoning does the task demand?</text>
  <text class="dg-titulo" x="730" y="34" font-size="19" text-anchor="middle">Delegation ladder</text>
  <text class="dg-menor" x="730" y="56" font-size="14" text-anchor="middle">how much discretion will we grant?</text>

  <line class="dg-eixo" x1="70" y1="80" x2="70" y2="390" stroke-width="3"/>
  <line class="dg-eixo" x1="190" y1="80" x2="190" y2="390" stroke-width="3"/>
  <line class="dg-eixo" x1="570" y1="80" x2="570" y2="390" stroke-width="3"/>
  <line class="dg-eixo" x1="690" y1="80" x2="690" y2="390" stroke-width="3"/>

  <g>
    <line class="dg-forma" x1="70" y1="360" x2="190" y2="360" stroke-width="3"/>
    <text class="dg-menor" x="52" y="366" font-size="15" text-anchor="end">1</text>
    <text class="dg-rotulo" x="205" y="365" font-size="15">analytic–predictive</text>
    <line class="dg-forma" x1="70" y1="275" x2="190" y2="275" stroke-width="3"/>
    <text class="dg-menor" x="52" y="281" font-size="15" text-anchor="end">2</text>
    <text class="dg-rotulo" x="205" y="280" font-size="15">intervention-oriented</text>
    <line class="dg-forma" x1="70" y1="190" x2="190" y2="190" stroke-width="3"/>
    <text class="dg-menor" x="52" y="196" font-size="15" text-anchor="end">3</text>
    <text class="dg-rotulo" x="205" y="195" font-size="15">counterfactual–extrapolative</text>
    <line class="dg-forma" x1="70" y1="105" x2="190" y2="105" stroke-width="3"/>
    <text class="dg-menor" x="52" y="111" font-size="15" text-anchor="end">4</text>
    <text class="dg-rotulo" x="205" y="110" font-size="15">model-generative</text>
  </g>

  <g>
    <line class="dg-forma" x1="570" y1="360" x2="690" y2="360" stroke-width="3"/>
    <text class="dg-menor" x="552" y="366" font-size="15" text-anchor="end">1</text>
    <text class="dg-rotulo" x="705" y="365" font-size="15">informational support · analyst</text>
    <line class="dg-forma" x1="570" y1="275" x2="690" y2="275" stroke-width="3"/>
    <text class="dg-menor" x="552" y="281" font-size="15" text-anchor="end">2</text>
    <text class="dg-rotulo" x="705" y="280" font-size="15">tactical recommender · associate</text>
    <line class="dg-forma" x1="570" y1="190" x2="690" y2="190" stroke-width="3"/>
    <text class="dg-menor" x="552" y="196" font-size="15" text-anchor="end">3</text>
    <text class="dg-rotulo" x="705" y="195" font-size="15">bounded operator · unit manager</text>
    <line class="dg-forma" x1="570" y1="105" x2="690" y2="105" stroke-width="3"/>
    <text class="dg-menor" x="552" y="111" font-size="15" text-anchor="end">4</text>
    <text class="dg-rotulo" x="705" y="110" font-size="15">strategic executive · CEO</text>
  </g>

  <text class="dg-menor" x="230" y="410" font-size="14" text-anchor="middle">premise: reasoning produces performance</text>
  <text class="dg-menor" x="730" y="410" font-size="14" text-anchor="middle">premise: verified performance, whatever produced it</text>
</svg>
