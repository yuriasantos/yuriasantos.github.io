<!-- The Serrano result: Decision A (pricing) sits low on the causal ladder and high on the delegation ladder; Decision B (acquisition) the reverse. The two lines cross — that crossing is the paper's central claim, on the board. dg-* classes only. -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-titulo" x="230" y="34" font-size="19" text-anchor="middle">Causal level</text>
  <text class="dg-titulo" x="730" y="34" font-size="19" text-anchor="middle">Delegation tier</text>

  <line class="dg-eixo" x1="70" y1="80" x2="70" y2="390" stroke-width="3"/>
  <line class="dg-eixo" x1="190" y1="80" x2="190" y2="390" stroke-width="3"/>
  <line class="dg-eixo" x1="570" y1="80" x2="570" y2="390" stroke-width="3"/>
  <line class="dg-eixo" x1="690" y1="80" x2="690" y2="390" stroke-width="3"/>

  <g>
    <line class="dg-forma" x1="70" y1="360" x2="190" y2="360" stroke-width="3"/>
    <text class="dg-menor" x="52" y="366" font-size="15" text-anchor="end">1</text>
    <line class="dg-forma" x1="70" y1="275" x2="190" y2="275" stroke-width="3"/>
    <text class="dg-menor" x="52" y="281" font-size="15" text-anchor="end">2</text>
    <line class="dg-forma" x1="70" y1="190" x2="190" y2="190" stroke-width="3"/>
    <text class="dg-menor" x="52" y="196" font-size="15" text-anchor="end">3</text>
    <line class="dg-forma" x1="70" y1="105" x2="190" y2="105" stroke-width="3"/>
    <text class="dg-menor" x="52" y="111" font-size="15" text-anchor="end">4</text>
  </g>
  <g>
    <line class="dg-forma" x1="570" y1="360" x2="690" y2="360" stroke-width="3"/>
    <text class="dg-menor" x="712" y="366" font-size="15">1 · analyst</text>
    <line class="dg-forma" x1="570" y1="275" x2="690" y2="275" stroke-width="3"/>
    <text class="dg-menor" x="712" y="281" font-size="15">2 · associate</text>
    <line class="dg-forma" x1="570" y1="190" x2="690" y2="190" stroke-width="3"/>
    <text class="dg-menor" x="712" y="196" font-size="15">3 · unit manager</text>
    <line class="dg-forma" x1="570" y1="105" x2="690" y2="105" stroke-width="3"/>
    <text class="dg-menor" x="712" y="111" font-size="15">4 · CEO</text>
  </g>

  <!-- Decision A: pricing — causal 1–2, delegation 3 -->
  <line class="dg-linha" x1="190" y1="318" x2="570" y2="190" stroke-width="3"/>
  <circle class="dg-ponto" cx="130" cy="318" r="11"/>
  <circle class="dg-ponto" cx="630" cy="190" r="11"/>
  <text class="dg-rotulo" x="230" y="345" font-size="15">A · pricing, weekly</text>

  <!-- Decision B: acquisition — causal 3, delegation 1–2 -->
  <line class="dg-linha-2" x1="190" y1="190" x2="570" y2="318" stroke-width="3"/>
  <circle class="dg-ponto-2" cx="130" cy="190" r="11"/>
  <circle class="dg-ponto-2" cx="630" cy="318" r="11"/>
  <text class="dg-rotulo" x="230" y="170" font-size="15">B · acquisition in Bahia</text>

  <text class="dg-menor" x="480" y="410" font-size="14" text-anchor="middle">the shallow column is the one you would hand over</text>
</svg>
