<!-- McBride's three modes of intelligence mapped onto the causal ladder, as the editors summarise it (p. 9): associative ↔ Level 1, causal ↔ Level 2, interventional ↔ Levels 3–4. Contemporary AI: strong associative, limited causal discrimination, minimal interventional capacity. dg-* classes only. -->
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg">
  <!-- column headers -->
  <text class="dg-titulo" x="185" y="34" font-size="17" text-anchor="middle">McBride's three modes</text>
  <text class="dg-titulo" x="585" y="34" font-size="17" text-anchor="middle">Causal ladder</text>
  <text class="dg-titulo" x="840" y="34" font-size="17" text-anchor="middle">Contemporary AI</text>

  <!-- mode boxes, bottom to top -->
  <g>
    <rect class="dg-forma" x="30" y="300" width="310" height="110" rx="10" stroke-width="3"/>
    <text class="dg-rotulo" x="50" y="330" font-size="17">Associative</text>
    <text class="dg-menor" x="50" y="354" font-size="13">identifies patterns and regularities</text>
    <text class="dg-menor" x="50" y="372" font-size="13">across large information sets</text>
  </g>
  <g>
    <rect class="dg-forma" x="30" y="175" width="310" height="110" rx="10" stroke-width="3"/>
    <text class="dg-rotulo" x="50" y="205" font-size="17">Causal</text>
    <text class="dg-menor" x="50" y="229" font-size="13">models mechanisms; evaluates how</text>
    <text class="dg-menor" x="50" y="247" font-size="13">interventions propagate through a system</text>
  </g>
  <g>
    <rect class="dg-forma" x="30" y="50" width="310" height="110" rx="10" stroke-width="3"/>
    <text class="dg-rotulo" x="50" y="80" font-size="17">Interventional</text>
    <text class="dg-menor" x="50" y="104" font-size="13">reasons about effects of actions in untested</text>
    <text class="dg-menor" x="50" y="122" font-size="13">contexts; constructs new causal models</text>
  </g>

  <!-- ladder: rails at 470 and 700, rungs at 365 / 240 / 140 / 75 -->
  <line class="dg-forma" x1="470" y1="50" x2="470" y2="410" stroke-width="4" stroke-linecap="round"/>
  <line class="dg-forma" x1="700" y1="50" x2="700" y2="410" stroke-width="4" stroke-linecap="round"/>
  <line class="dg-linha" x1="470" y1="365" x2="700" y2="365" stroke-width="6" stroke-linecap="round"/>
  <line class="dg-linha" x1="470" y1="240" x2="700" y2="240" stroke-width="6" stroke-linecap="round"/>
  <line class="dg-linha" x1="470" y1="140" x2="700" y2="140" stroke-width="6" stroke-linecap="round"/>
  <line class="dg-linha-2" x1="470" y1="75" x2="700" y2="75" stroke-width="6" stroke-linecap="round"/>
  <text class="dg-rotulo" x="585" y="355" font-size="13" text-anchor="middle">1 · analytic–predictive</text>
  <text class="dg-rotulo" x="585" y="230" font-size="13" text-anchor="middle">2 · intervention-oriented</text>
  <text class="dg-rotulo" x="585" y="130" font-size="13" text-anchor="middle">3 · counterfactual–extrapolative</text>
  <text class="dg-rotulo" x="585" y="65" font-size="13" text-anchor="middle">4 · model-generative</text>

  <!-- links mode → rungs, labels on the left half of the gap -->
  <line class="dg-eixo" x1="340" y1="355" x2="470" y2="365" stroke-width="2"/>
  <line class="dg-eixo" x1="340" y1="230" x2="470" y2="240" stroke-width="2"/>
  <line class="dg-eixo" x1="340" y1="105" x2="470" y2="140" stroke-width="2"/>
  <line class="dg-eixo" x1="340" y1="105" x2="470" y2="75" stroke-width="2"/>
  <text class="dg-menor" x="405" y="348" font-size="11.5" text-anchor="middle">corresponds closely</text>
  <text class="dg-menor" x="405" y="223" font-size="11.5" text-anchor="middle">maps onto</text>
  <text class="dg-menor" x="405" y="90" font-size="11.5" text-anchor="middle">roughly maps to</text>

  <!-- AI today -->
  <circle class="dg-ponto" cx="740" cy="358" r="9"/>
  <text class="dg-rotulo" x="760" y="363" font-size="15">strong</text>
  <text class="dg-menor" x="760" y="383" font-size="12.5">"highly capable associative reasoners</text>
  <text class="dg-menor" x="760" y="400" font-size="12.5">with strong articulation abilities"</text>

  <circle class="dg-forma" cx="740" cy="233" r="9" stroke-width="3"/>
  <text class="dg-rotulo" x="760" y="238" font-size="15">limited</text>
  <text class="dg-menor" x="760" y="258" font-size="12.5">"limited causal discrimination"</text>

  <circle class="dg-forma" cx="740" cy="105" r="9" stroke-width="3" stroke-dasharray="3 3"/>
  <text class="dg-rotulo" x="760" y="110" font-size="15">minimal</text>
  <text class="dg-menor" x="760" y="130" font-size="12.5">"minimal interventional capacity"</text>

  <text class="dg-menor" x="480" y="434" font-size="12.5" text-anchor="middle">humans, by contrast: "richer causal reasoning and contextual judgment" — but not the breadth, speed and consistency of machine pattern extraction</text>
</svg>
