<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img"><text x="684" y="26" font-size="20" fill="var(--muted)" font-weight="700" text-anchor="middle" dominant-baseline="middle">THE MODEL SAYS</text><text x="492.0" y="62" font-size="24" fill="var(--ink)" font-weight="700" text-anchor="middle" dominant-baseline="middle">stays</text><text x="876.0" y="62" font-size="24" fill="var(--ink)" font-weight="700" text-anchor="middle" dominant-baseline="middle">cancels</text><text x="112" y="252" font-size="20" fill="var(--muted)" font-weight="700" text-anchor="middle" transform="rotate(-90 112 252)">WHAT ACTUALLY HAPPENED</text><text x="232" y="174.0" font-size="24" fill="var(--ink)" font-weight="700" text-anchor="end" dominant-baseline="middle">stayed</text><text x="232" y="330.0" font-size="24" fill="var(--ink)" font-weight="700" text-anchor="end" dominant-baseline="middle">cancelled</text><rect x="305" y="101" width="374" height="146" rx="10" fill="var(--accent)" fill-opacity="0.07" stroke="var(--accent)" stroke-width="1.5"/><text x="492.0" y="118.0" font-size="20" fill="var(--accent)" font-weight="700" text-anchor="middle" dominant-baseline="middle">TRUE NEGATIVE</text><text x="492.0" y="152.0" font-size="34" fill="var(--ink)" font-weight="700" text-anchor="middle" dominant-baseline="middle">1,157</text><text x="492.0" y="186.0" font-size="20" fill="var(--ink)" font-weight="400" text-anchor="middle" dominant-baseline="middle">Said stay — they stayed</text><text x="492.0" y="218.0" font-size="20" fill="var(--muted)" font-weight="400" text-anchor="middle" dominant-baseline="middle">Nothing to do. Correct.</text><rect x="689" y="101" width="374" height="146" rx="10" fill="var(--accent-2)" fill-opacity="0.13" stroke="var(--accent-2)" stroke-width="2.5"/><text x="876.0" y="118.0" font-size="20" fill="var(--accent-2)" font-weight="700" text-anchor="middle" dominant-baseline="middle">FALSE POSITIVE</text><text x="876.0" y="152.0" font-size="34" fill="var(--ink)" font-weight="700" text-anchor="middle" dominant-baseline="middle">137</text><text x="876.0" y="186.0" font-size="20" fill="var(--ink)" font-weight="400" text-anchor="middle" dominant-baseline="middle">Said cancel — they stayed</text><text x="876.0" y="218.0" font-size="20" fill="var(--accent-2)" font-weight="600" text-anchor="middle" dominant-baseline="middle">FALSE ALARM · you paid the offer for nothing</text><rect x="305" y="257" width="374" height="146" rx="10" fill="var(--accent-2)" fill-opacity="0.13" stroke="var(--accent-2)" stroke-width="2.5"/><text x="492.0" y="274.0" font-size="20" fill="var(--accent-2)" font-weight="700" text-anchor="middle" dominant-baseline="middle">FALSE NEGATIVE</text><text x="492.0" y="308.0" font-size="34" fill="var(--ink)" font-weight="700" text-anchor="middle" dominant-baseline="middle">233</text><text x="492.0" y="342.0" font-size="20" fill="var(--ink)" font-weight="400" text-anchor="middle" dominant-baseline="middle">Said stay — they left</text><text x="492.0" y="374.0" font-size="20" fill="var(--accent-2)" font-weight="600" text-anchor="middle" dominant-baseline="middle">MISSED · the customer walked out</text><rect x="689" y="257" width="374" height="146" rx="10" fill="var(--accent)" fill-opacity="0.07" stroke="var(--accent)" stroke-width="1.5"/><text x="876.0" y="274.0" font-size="20" fill="var(--accent)" font-weight="700" text-anchor="middle" dominant-baseline="middle">TRUE POSITIVE</text><text x="876.0" y="308.0" font-size="34" fill="var(--ink)" font-weight="700" text-anchor="middle" dominant-baseline="middle">234</text><text x="876.0" y="342.0" font-size="20" fill="var(--ink)" font-weight="400" text-anchor="middle" dominant-baseline="middle">Said cancel — they cancelled</text><text x="876.0" y="374.0" font-size="20" fill="var(--muted)" font-weight="400" text-anchor="middle" dominant-baseline="middle">Caught it. The offer gets a chance.</text><text x="590.0" y="454" font-size="25" fill="var(--ink)" font-weight="600" text-anchor="middle" dominant-baseline="middle">The two orange squares are the two ways to be wrong — and they do NOT cost the same.</text></svg>