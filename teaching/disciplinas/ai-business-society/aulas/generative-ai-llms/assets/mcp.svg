<!-- D12: MCP — host ▸ clients ▸ servers ▸ (tools · resources · prompts) ▸ company systems. After the MCP architecture docs. -->
<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="seta-mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="dg-seta-cabeca" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <rect class="dg-linha-2" x="40" y="130" width="200" height="140" rx="10" stroke-width="2.4"/>
  <text class="dg-rotulo" x="140" y="165" font-size="17" text-anchor="middle">host</text>
  <text class="dg-menor" x="140" y="186" font-size="13" text-anchor="middle">the AI application</text>
  <text class="dg-menor" x="140" y="203" font-size="13" text-anchor="middle">(model + harness)</text>
  <rect class="dg-forma" x="70" y="220" width="140" height="34" rx="6" stroke-width="1.4"/>
  <text class="dg-menor" x="140" y="242" font-size="13" text-anchor="middle">client · client · client</text>
  <g stroke-width="1.8">
    <path class="dg-seta" d="M 242 170 L 330 90" marker-end="url(#seta-mcp)"/>
    <path class="dg-seta" d="M 242 200 L 330 200" marker-end="url(#seta-mcp)"/>
    <path class="dg-seta" d="M 242 230 L 330 310" marker-end="url(#seta-mcp)"/>
  </g>
  <text class="dg-menor" x="286" y="150" font-size="12" text-anchor="middle">one protocol</text>
  <g stroke-width="1.8">
    <rect class="dg-forma" x="336" y="60" width="170" height="60" rx="8"/>
    <rect class="dg-forma" x="336" y="170" width="170" height="60" rx="8"/>
    <rect class="dg-forma" x="336" y="280" width="170" height="60" rx="8"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text class="dg-rotulo" x="421" y="85">server</text><text class="dg-menor" x="421" y="105" font-size="12">for the CRM</text>
    <text class="dg-rotulo" x="421" y="195">server</text><text class="dg-menor" x="421" y="215" font-size="12">for the database</text>
    <text class="dg-rotulo" x="421" y="305">server</text><text class="dg-menor" x="421" y="325" font-size="12">for the file share</text>
  </g>
  <g stroke-width="1.5">
    <path class="dg-eixo" d="M 508 90 L 560 90"/>
    <path class="dg-eixo" d="M 508 200 L 560 200"/>
    <path class="dg-eixo" d="M 508 310 L 560 310"/>
  </g>
  <rect class="dg-forma" x="562" y="60" width="230" height="280" rx="10" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="dg-menor" x="677" y="88" font-size="13" text-anchor="middle">what a server offers</text>
  <text class="dg-rotulo" x="590" y="130" font-size="15">tools</text><text class="dg-menor" x="590" y="148" font-size="12">actions — a query, an API call</text>
  <text class="dg-rotulo" x="590" y="195" font-size="15">resources</text><text class="dg-menor" x="590" y="213" font-size="12">data — a record, a file, a schema</text>
  <text class="dg-rotulo" x="590" y="260" font-size="15">prompts</text><text class="dg-menor" x="590" y="278" font-size="12">templates — how to ask</text>
  <text class="dg-menor" x="677" y="322" font-size="12" text-anchor="middle">the company's systems sit behind</text>
  <text class="dg-menor" x="410" y="380" font-size="14" text-anchor="middle">MCP carries context; it does not decide what to do with it</text>
