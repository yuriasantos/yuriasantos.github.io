<!-- D1: any text becomes a list of numbers; with numbers you can measure. -->
<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="seta-t2v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="dg-seta-cabeca" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <rect class="dg-forma" x="20" y="130" width="220" height="120" rx="8" stroke-width="1.8"/>
  <text class="dg-rotulo" x="130" y="175" font-size="17" text-anchor="middle">"The customer</text>
  <text class="dg-rotulo" x="130" y="200" font-size="17" text-anchor="middle">returned the product"</text>
  <text class="dg-menor" x="130" y="232" font-size="12.5" text-anchor="middle">a word · a sentence · a document</text>
  <path class="dg-seta" d="M 232 190 L 292 190" stroke-width="1.8" marker-end="url(#seta-t2v)"/>
  <rect class="dg-linha-2" x="298" y="130" width="230" height="120" rx="8" stroke-width="2.4"/>
  <text class="dg-rotulo" x="413" y="180" font-size="19" text-anchor="middle" font-family="monospace">[0.12  −0.87  0.45</text>
  <text class="dg-rotulo" x="413" y="206" font-size="19" text-anchor="middle" font-family="monospace">0.33  …  −0.21]</text>
  <text class="dg-menor" x="413" y="232" font-size="14" text-anchor="middle">a list of numbers — a vector</text>
  <path class="dg-seta" d="M 530 160 L 580 100" stroke-width="1.8" marker-end="url(#seta-t2v)"/>
  <path class="dg-seta" d="M 530 190 L 580 190" stroke-width="1.8" marker-end="url(#seta-t2v)"/>
  <path class="dg-seta" d="M 530 220 L 580 280" stroke-width="1.8" marker-end="url(#seta-t2v)"/>
  <rect class="dg-forma" x="586" y="70" width="224" height="50" rx="8" stroke-width="1.8"/>
  <text class="dg-rotulo" x="698" y="101" font-size="15" text-anchor="middle">compare — how close?</text>
  <rect class="dg-forma" x="586" y="165" width="224" height="50" rx="8" stroke-width="1.8"/>
  <text class="dg-rotulo" x="698" y="196" font-size="15" text-anchor="middle">classify — which group?</text>
  <rect class="dg-forma" x="586" y="260" width="224" height="50" rx="8" stroke-width="1.8"/>
  <text class="dg-rotulo" x="698" y="291" font-size="15" text-anchor="middle">search — the nearest</text>
  <text class="dg-menor" x="410" y="345" font-size="15" text-anchor="middle">without numbers there is no "similar"</text>
</svg>
