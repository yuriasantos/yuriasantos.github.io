<!-- D6: the same word, two sentences, two vectors — attention weighs the neighbours. -->
<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg">
  <g font-size="19" text-anchor="middle">
    <text class="dg-menor" x="70" y="80">The</text>
    <text class="dg-titulo" x="150" y="80">bank</text>
    <text class="dg-rotulo" x="250" y="80">approved</text>
    <text class="dg-menor" x="340" y="80">the</text>
    <text class="dg-rotulo" x="410" y="80">loan</text>
  </g>
  <path class="dg-linha" d="M 150 88 Q 200 130 250 88" stroke-width="3.5"/>
  <path class="dg-linha" d="M 150 88 Q 280 160 410 88" stroke-width="5"/>
  <path class="dg-eixo" d="M 150 88 Q 245 120 340 88" stroke-width="1"/>
  <path class="dg-eixo" d="M 150 88 Q 110 110 70 88" stroke-width="1"/>
  <circle class="dg-ponto" cx="150" cy="185" r="9"/>
  <text class="dg-menor" x="150" y="215" font-size="14" text-anchor="middle">bank₁</text>
  <line class="dg-traco" x1="30" y1="235" x2="790" y2="235" stroke-width="1"/>
  <g font-size="19" text-anchor="middle">
    <text class="dg-menor" x="70" y="290">We</text>
    <text class="dg-menor" x="140" y="290">sat</text>
    <text class="dg-menor" x="205" y="290">on the</text>
    <text class="dg-titulo" x="290" y="290">bank</text>
    <text class="dg-menor" x="365" y="290">of the</text>
    <text class="dg-rotulo" x="450" y="290">river</text>
  </g>
  <path class="dg-linha-2" d="M 290 298 Q 370 350 450 298" stroke-width="5"/>
  <path class="dg-eixo" d="M 290 298 Q 215 330 140 298" stroke-width="1"/>
  <circle class="dg-ponto-2" cx="290" cy="352" r="9"/>
  <text class="dg-menor" x="290" y="380" font-size="14" text-anchor="middle">bank₂</text>
  <g>
    <rect class="dg-forma" x="560" y="60" width="230" height="150" rx="8" stroke-width="1.5"/>
    <text class="dg-menor" x="675" y="90" font-size="14" text-anchor="middle">the space of meanings</text>
    <circle class="dg-ponto" cx="620" cy="150" r="7"/><text class="dg-menor" x="620" y="178" font-size="13" text-anchor="middle">loan · credit</text>
    <circle class="dg-ponto" cx="640" cy="130" r="7"/>
    <circle class="dg-ponto-2" cx="740" cy="160" r="7"/><text class="dg-menor" x="740" y="188" font-size="13" text-anchor="middle">river · shore</text>
    <circle class="dg-ponto-2" cx="720" cy="140" r="7"/>
  </g>
  <text class="dg-menor" x="675" y="330" font-size="15" text-anchor="middle">2013: one vector per word</text>
  <text class="dg-rotulo" x="675" y="356" font-size="15" text-anchor="middle">2017: one vector per word, per sentence</text>
</svg>
